receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20
  resourcedetection/gcp:
    detectors: [gcp]
    timeout: 10s
  transform/collision:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["exported_location"], attributes["location"]) where attributes["location"] != nil
          - delete_key(attributes, "location") where attributes["location"] != nil
          - set(attributes["exported_namespace"], attributes["namespace"]) where attributes["namespace"] != nil
  batch:
    send_batch_max_size: 200
    send_batch_size: 200
    timeout: 5s

exporters:
  googlemanagedprometheus: {}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors:
        [memory_limiter, resourcedetection/gcp, transform/collision, batch]
      exporters: [googlemanagedprometheus]
